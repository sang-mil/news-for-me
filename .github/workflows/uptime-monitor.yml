name: Production uptime monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: news-for-me-production-uptime
  cancel-in-progress: false

jobs:
  monitor:
    name: Check Pages, API and D1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production and manage incident
        uses: actions/github-script@v7
        env:
          HEALTH_BASE_URL: https://news-for-me.pages.dev
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const baseUrl = process.env.HEALTH_BASE_URL.replace(/\/$/, "");
            const incidentTitle = "[monitor] News for Me production outage";

            async function checkEndpoint(name, url, validate) {
              let lastDetail = "No response";
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  const response = await fetch(url, {
                    headers: { accept: "application/json" },
                    signal: AbortSignal.timeout(12000)
                  });
                  const text = await response.text();
                  let body = null;
                  try { body = JSON.parse(text); } catch {}

                  if (validate(response, body)) {
                    return { name, url, ok: true, detail: `HTTP ${response.status}` };
                  }
                  lastDetail = `HTTP ${response.status}; response: ${text.slice(0, 300) || "(empty)"}`;
                } catch (error) {
                  lastDetail = error instanceof Error ? error.message : String(error);
                }

                if (attempt < 3) {
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
              }

              return { name, url, ok: false, detail: `3 attempts failed; ${lastDetail}` };
            }

            const results = await Promise.all([
              checkEndpoint("Pages", `${baseUrl}/`, (response) => response.ok),
              checkEndpoint(
                "API + D1",
                `${baseUrl}/api/health`,
                (response, body) =>
                  response.ok &&
                  body?.ok === true &&
                  body?.service === "news-for-me-api" &&
                  body?.database === "connected"
              )
            ]);

            const failures = results.filter((result) => !result.ok);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const incident = openIssues.find(
              (issue) => !issue.pull_request && issue.title === incidentTitle
            );

            async function sendDiscord(message) {
              const webhook = process.env.DISCORD_WEBHOOK_URL;
              if (!webhook) {
                core.warning("DISCORD_WEBHOOK_URL is not configured. GitHub issue notification remains enabled.");
                return;
              }
              try {
                const response = await fetch(webhook, {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ content: message })
                });
                if (!response.ok) {
                  core.warning(`Discord webhook returned HTTP ${response.status}.`);
                }
              } catch (error) {
                core.warning(`Discord notification failed: ${error instanceof Error ? error.message : String(error)}`);
              }
            }

            if (failures.length > 0) {
              const report = failures.map((item) => `- ${item.name}: ${item.url}\n  ${item.detail}`).join("\n");
              if (!incident) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: incidentTitle,
                  assignees: [owner],
                  body: [
                    "## Production health check detected an outage",
                    "",
                    `Detected at: ${new Date().toISOString()}`,
                    "",
                    report,
                    "",
                    `Monitor run: ${runUrl}`,
                    "",
                    "이 이슈는 장애가 처음 감지되었을 때 한 번 생성됩니다. 정상 상태가 확인되면 모니터가 복구 내용을 댓글로 남기고 자동으로 닫습니다."
                  ].join("\n")
                });
                core.error(`Production outage detected. Incident issue #${created.data.number} created.`);
                await sendDiscord(
                  `🚨 **News for Me 장애 감지**\n${report}\n이슈: ${created.data.html_url}\n모니터: ${runUrl}`
                );
              } else {
                core.error(`Production remains unhealthy. Tracking in issue #${incident.number}.`);
              }
              core.setFailed("Production health check failed.");
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: [
                  "## 복구 확인",
                  "",
                  `Recovered at: ${new Date().toISOString()}`,
                  "",
                  ...results.map((item) => `- ${item.name}: healthy (${item.detail})`),
                  "",
                  `Monitor run: ${runUrl}`
                ].join("\n")
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed"
              });
              await sendDiscord(
                `✅ **News for Me 서비스 복구**\nPages 및 API/D1 헬스체크가 정상으로 돌아왔습니다.\n닫힌 장애 이슈: #${incident.number}\n모니터: ${runUrl}`
              );
              core.notice(`Production recovered. Incident issue #${incident.number} closed.`);
              return;
            }

            for (const item of results) {
              core.info(`Healthy: ${item.name} (${item.detail})`);
            }
            core.notice("Production Pages, API and D1 are healthy.");
