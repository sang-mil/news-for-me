name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "design/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Run npm install until the Better Auth workspace dependency is locked locally.
        run: npm install

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Typecheck worker
        run: npm run typecheck:api

      - name: Build web
        run: npm run build
