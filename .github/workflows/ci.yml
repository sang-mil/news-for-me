name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "design/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR checks, but do not interrupt a production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Run npm install until the Better Auth workspace dependency is locked locally.
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Typecheck worker
        run: npm run typecheck:api

      - name: Build web
        run: npm run build

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: news-for-me-pages-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: news-for-me-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: news-for-me-pages-dist
          path: apps/web/dist

      - name: Apply production D1 migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply news-for-me-db --remote --config wrangler.jsonc

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Deploy Pages
        working-directory: apps/web
        # Wrangler automatically loads ./wrangler.jsonc from the working directory.
        run: npx wrangler pages deploy dist --project-name news-for-me --branch main --commit-hash "$GITHUB_SHA"

      - name: Verify production API and D1 health
        env:
          HEALTH_URL: https://news-for-me.pages.dev/api/health
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.HEALTH_URL;
          let lastError = "No response";

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { accept: "application/json" },
                signal: AbortSignal.timeout(10000)
              });
              const body = await response.json().catch(() => null);

              if (
                response.ok &&
                body?.ok === true &&
                body?.service === "news-for-me-api" &&
                body?.database === "connected"
              ) {
                console.log("Production API health check passed:", JSON.stringify(body));
                process.exit(0);
              }

              lastError = `HTTP ${response.status}; body=${JSON.stringify(body)}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }

            console.warn(`Health check attempt ${attempt}/6 failed: ${lastError}`);
            if (attempt < 6) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }

          console.error(`Production API health check failed after 6 attempts: ${lastError}`);
          process.exit(1);
          NODE
