name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "design/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR checks, but do not interrupt a production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Run npm install until the Better Auth workspace dependency is locked locally.
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Typecheck worker
        run: npm run typecheck:api

      - name: Build web
        run: npm run build

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: news-for-me-pages-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: news-for-me-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: news-for-me-pages-dist
          path: apps/web/dist

      - name: Apply production D1 migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply news-for-me-db --remote --config wrangler.jsonc

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Deploy Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name news-for-me --branch main --commit-hash "$GITHUB_SHA" --config wrangler.jsonc
